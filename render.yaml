# Render Blueprint — The Lenny Growth Assistant
# Deploy: https://dashboard.render.com → New → Blueprint
# All services are provisioned automatically from this file.

databases:
  - name: lenny-growth-db
    plan: free
    databaseName: lenny_growth
    user: lenny_app
    postgresMajorVersion: 16

services:
  - type: web
    name: lenny-growth-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lenny-growth-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false          # Optional — only needed if using Claude
      - key: GEMINI_API_KEY
        sync: false          # Set this in Render dashboard — free key from aistudio.google.com
      - key: DEFAULT_LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
